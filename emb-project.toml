project = "prj-sumobot"

[ci]
target = "//applications/sumobot:app"
config = "atmega32u4"
artifact-patterns = "*.hex *.elf *.bin app"
submodules = "true"

# Submodules this branch follows. Not listed = frozen.
# track: branch, or "tag:<glob>"; mode: auto (push after green CI), pr, off.
# Release branches must follow a maintained line (e.g. "release/1.x"), not main.
[follow."emb-toolchain"]
track = "main"
mode = "auto"

[follow."emb-platform"]
track = "main"
mode = "auto"

[follow."ci/emb-ci"]
track = "main"
mode = "auto"
